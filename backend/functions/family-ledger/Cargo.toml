[package]
name = "family-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The family expenses ledger: money rules, storage protocols and route handlers"

[dependencies]
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb.workspace = true
family-core.workspace = true
lambda_http.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio = { workspace = true, optional = true }

[features]
# Builds the one-time transaction date backfill. Lambda builds leave it out.
backfill = ["dep:aws-config", "dep:tokio"]
# Runs tests/ddb_local.rs, which needs DynamoDB Local. Use scripts/test-ddb-local.sh.
ddb-local-tests = []

[[bin]]
name = "backfill-transaction-date"
path = "src/bin/backfill_transaction_date.rs"
required-features = ["backfill"]

[[test]]
name = "ddb_local"
required-features = ["ddb-local-tests"]

[dev-dependencies]
rstest.workspace = true
tokio.workspace = true
