[workspace]
resolver = "2"
members = [
    "family-core",
    "health-get",
    "me-get",
    "auth-session",
    "auth-presignup",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.94.1"

[workspace.dependencies]
family-core = { path = "family-core" }

lambda_http = "1.3.0"
lambda_runtime = "1.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
# Without default features this drops the deprecated hyper 0.14 TLS stack, which carries
# advisories and is never selected at BehaviorVersion::latest().
aws-sdk-dynamodb = { version = "1.119.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1"
# ring and webpki-roots only, which cross-compile to arm64 without cmake. Blocking, so calls run
# inside spawn_blocking.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

rstest = "0.26.1"

# These handlers are I/O-bound, so optimising for size shortens cold starts at no runtime cost.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
