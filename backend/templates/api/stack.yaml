AWSTemplateFormatVersion: '2010-09-09'
Description: 'REST API and Lambda functions for the family dashboard'
Parameters:
  AppName:
    Type: String
  ExportKey:
    Type: String
  StackName:
    Type: String
  Salt:
    Type: String
  DomainName:
    Type: String
  HealthGetCodeS3Key:
    Type: String
  MeGetCodeS3Key:
    Type: String
  AuthSessionCodeS3Key:
    Type: String
  LedgerReadCodeS3Key:
    Type: String
  MeProfilePutCodeS3Key:
    Type: String
  ExpensesWriteCodeS3Key:
    Type: String
  PaymentsPostCodeS3Key:
    Type: String
  GroupsWriteCodeS3Key:
    Type: String
  ExchangeRatesPostCodeS3Key:
    Type: String
Resources:

#  --START -- HEALTH

  HealthGetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-health-get'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
  HealthGetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-health-get'
      RetentionInDays: 30
  HealthGetFunction:
    Type: AWS::Lambda::Function
    DependsOn: HealthGetLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-health-get'
      Description: !Sub 'GET /api/health - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt HealthGetRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref HealthGetCodeS3Key

#  --END -- HEALTH

#  --START -- ME

  MeGetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-me-get'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: read-allowlist
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'dynamodb:GetItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  MeGetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-me-get'
      RetentionInDays: 30
  MeGetFunction:
    Type: AWS::Lambda::Function
    DependsOn: MeGetLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-me-get'
      Description: !Sub 'GET /api/me - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt MeGetRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref MeGetCodeS3Key

#  --END -- ME

#  --START -- AUTH SESSION

  # No AWS permissions beyond logging: this function only talks to Cognito's public OAuth
  # endpoints. Its routes have no authorizer because they establish or end the session.
  AuthSessionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-auth-session'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
  AuthSessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-auth-session'
      RetentionInDays: 30
  AuthSessionFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthSessionLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-auth-session'
      Description: !Sub 'POST and DELETE /api/auth/session - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt AuthSessionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          COGNITO_DOMAIN: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-CognitoDomain'
          USER_POOL_CLIENT_ID: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-UserPoolClientId'
          SITE_ORIGIN: !Sub 'https://${DomainName}'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref AuthSessionCodeS3Key

#  --END -- AUTH SESSION

#  --START -- LEDGER

  # Each function gets only the table actions it calls. A transaction needs PutItem for its writes
  # and ConditionCheckItem for its allowlist check. Nothing here can delete or scan.

  LedgerReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-ledger-read'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: read-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:BatchGetItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  LedgerReadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-ledger-read'
      RetentionInDays: 30
  LedgerReadFunction:
    Type: AWS::Lambda::Function
    DependsOn: LedgerReadLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-ledger-read'
      Description: !Sub 'GET /api/ledger, /api/expenses and /api/payments - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt LedgerReadRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref LedgerReadCodeS3Key

  MeProfilePutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-me-profile-put'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: write-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:BatchGetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:ConditionCheckItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  MeProfilePutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-me-profile-put'
      RetentionInDays: 30
  MeProfilePutFunction:
    Type: AWS::Lambda::Function
    DependsOn: MeProfilePutLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-me-profile-put'
      Description: !Sub 'PUT /api/me/profile - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt MeProfilePutRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref MeProfilePutCodeS3Key

  ExpensesWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-expenses-write'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: write-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:BatchGetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:ConditionCheckItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  ExpensesWriteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-expenses-write'
      RetentionInDays: 30
  ExpensesWriteFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExpensesWriteLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-expenses-write'
      Description: !Sub 'POST and PUT /api/expenses - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt ExpensesWriteRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref ExpensesWriteCodeS3Key

  PaymentsPostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-payments-post'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: write-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:BatchGetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:ConditionCheckItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  PaymentsPostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-payments-post'
      RetentionInDays: 30
  PaymentsPostFunction:
    Type: AWS::Lambda::Function
    DependsOn: PaymentsPostLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-payments-post'
      Description: !Sub 'POST /api/payments and PUT /api/payments/{paymentId} - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt PaymentsPostRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref PaymentsPostCodeS3Key

  GroupsWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-groups-write'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: write-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:BatchGetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:ConditionCheckItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  GroupsWriteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-groups-write'
      RetentionInDays: 30
  GroupsWriteFunction:
    Type: AWS::Lambda::Function
    DependsOn: GroupsWriteLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-groups-write'
      Description: !Sub 'POST and PUT /api/groups - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt GroupsWriteRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref GroupsWriteCodeS3Key

  ExchangeRatesPostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${StackName}-${Salt}-exchange-rates-post'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: write-ledger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:BatchGetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:ConditionCheckItem'
                Resource: !ImportValue
                  'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableArn'
  ExchangeRatesPostLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StackName}-${Salt}-exchange-rates-post'
      RetentionInDays: 30
  ExchangeRatesPostFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExchangeRatesPostLogGroup
    Properties:
      FunctionName: !Sub '${StackName}-${Salt}-exchange-rates-post'
      Description: !Sub 'POST /api/exchange-rates - ${AppName} - stack ${StackName}'
      Runtime: provided.al2023
      Architectures:
        - arm64
      Handler: bootstrap
      Role: !GetAtt ExchangeRatesPostRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !ImportValue
            'Fn::Sub': '${ExportKey}-${StackName}-FamilyTableName'
          RUST_LOG: info
      Code:
        S3Bucket: !ImportValue
          'Fn::Sub': '${ExportKey}-${StackName}-ArtifactsBucketName'
        S3Key: !Ref ExchangeRatesPostCodeS3Key

#  --END -- LEDGER

#  --START -- REST API

  # Publishing is done by scripts/deploy-vertical.sh with `aws apigateway create-deployment`.
  # CloudFormation does not create a new deployment when Body changes, so there is intentionally
  # no AWS::ApiGateway::Deployment or Stage here.
  #
  # Every error body uses {"error": {"code", "message"}}. `code` is the contract the frontend
  # translates, and `message` is English diagnostic text that is never shown to users. A new code
  # needs a translation under errors.* in frontend/web/src/i18n/locales, and a test enforces it.
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${StackName}-${Salt}-api'
      Description: !Sub '${AppName} API - stack ${StackName}'
      EndpointConfiguration:
        Types:
          - REGIONAL
      Body:
        openapi: 3.0.1
        info:
          title: !Sub '${AppName} API'
          version: '1.0.0'
        x-amazon-apigateway-request-validators:
          body-only:
            validateRequestBody: true
            validateRequestParameters: false
        x-amazon-apigateway-gateway-responses:
          BAD_REQUEST_BODY:
            statusCode: 400
            responseTemplates:
              application/json: '{"error": {"code": "validation_error", "message": "The request body is not valid."}}'
          UNAUTHORIZED:
            statusCode: 401
            responseTemplates:
              application/json: '{"error": {"code": "unauthorized", "message": "Authentication is required."}}'
          ACCESS_DENIED:
            statusCode: 403
            responseTemplates:
              application/json: '{"error": {"code": "forbidden", "message": "This action is not allowed."}}'
          THROTTLED:
            statusCode: 429
            responseTemplates:
              application/json: '{"error": {"code": "too_many_requests", "message": "Too many requests."}}'
          DEFAULT_4XX:
            responseTemplates:
              application/json: '{"error": {"code": "request_error", "message": "The request could not be processed."}}'
          DEFAULT_5XX:
            responseTemplates:
              application/json: '{"error": {"code": "internal_error", "message": "An unexpected error occurred."}}'
        components:
          securitySchemes:
            CognitoUserPool:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                  - !ImportValue
                    'Fn::Sub': '${ExportKey}-${StackName}-UserPoolArn'
          schemas:
            SessionMintRequest:
              type: object
              additionalProperties: false
              required:
                - code
                - codeVerifier
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 2048
                codeVerifier:
                  type: string
                  minLength: 43
                  maxLength: 128
            ProfileRequest:
              type: object
              additionalProperties: false
              required:
                - homeCurrency
              properties:
                homeCurrency:
                  type: string
                displayName:
                  type: string
                tone:
                  type: string
            NewExpenseRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - title
                - kind
                - groupId
                - payerId
                - amountMinor
                - currency
                - date
                - splitMode
                - participantIds
              properties:
                requestId:
                  type: string
                title:
                  type: string
                kind:
                  type: string
                groupId:
                  type: string
                payerId:
                  type: string
                amountMinor:
                  type: integer
                currency:
                  type: string
                date:
                  type: string
                transactionDate:
                  type: string
                splitMode:
                  type: string
                participantIds:
                  type: array
                  items:
                    type: string
                percents:
                  type: object
                  additionalProperties:
                    type: integer
                otherAmount:
                  type: object
                  additionalProperties: false
                  required:
                    - amountMinor
                    - currency
                  properties:
                    amountMinor:
                      type: integer
                    currency:
                      type: string
                chargedCurrency:
                  type: string
                note:
                  type: string
                usualSplit:
                  type: object
                  additionalProperties:
                    type: integer
            ExpenseEditRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - title
                - kind
                - groupId
                - payerId
                - amountMinor
                - currency
                - splitMode
                - participantIds
                - version
              properties:
                requestId:
                  type: string
                title:
                  type: string
                kind:
                  type: string
                groupId:
                  type: string
                payerId:
                  type: string
                amountMinor:
                  type: integer
                currency:
                  type: string
                transactionDate:
                  type: string
                splitMode:
                  type: string
                participantIds:
                  type: array
                  items:
                    type: string
                percents:
                  type: object
                  additionalProperties:
                    type: integer
                otherAmount:
                  type: object
                  additionalProperties: false
                  required:
                    - amountMinor
                    - currency
                  properties:
                    amountMinor:
                      type: integer
                    currency:
                      type: string
                chargedCurrency:
                  type: string
                note:
                  type: string
                usualSplit:
                  type: object
                  additionalProperties:
                    type: integer
                version:
                  type: integer
            PaymentRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - fromId
                - toId
                - paid
                - method
                - date
              properties:
                requestId:
                  type: string
                fromId:
                  type: string
                toId:
                  type: string
                paid:
                  type: object
                  additionalProperties: false
                  required:
                    - amountMinor
                    - currency
                  properties:
                    amountMinor:
                      type: integer
                    currency:
                      type: string
                credited:
                  type: object
                  additionalProperties: false
                  required:
                    - amountMinor
                    - currency
                  properties:
                    amountMinor:
                      type: integer
                    currency:
                      type: string
                method:
                  type: string
                date:
                  type: string
                transactionDate:
                  type: string
                groupId:
                  type: string
            PaymentEditRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - transactionDate
                - version
              properties:
                requestId:
                  type: string
                transactionDate:
                  type: string
                version:
                  type: integer
            NewGroupRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - name
                - memberIds
              properties:
                requestId:
                  type: string
                name:
                  type: string
                memberIds:
                  type: array
                  items:
                    type: string
                usualSplit:
                  type: object
                  additionalProperties:
                    type: integer
            GroupEditRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - name
                - memberIds
                - version
              properties:
                requestId:
                  type: string
                name:
                  type: string
                memberIds:
                  type: array
                  items:
                    type: string
                version:
                  type: integer
                usualSplit:
                  type: object
                  additionalProperties:
                    type: integer
            ExchangeRatesRequest:
              type: object
              additionalProperties: false
              required:
                - requestId
                - usdCad
                - cadClp
                - date
              properties:
                requestId:
                  type: string
                usdCad:
                  type: string
                cadClp:
                  type: string
                date:
                  type: string
        paths:
          /api/health:
            get:
              responses:
                '200':
                  description: The API is reachable
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HealthGetFunction.Arn}/invocations'
          /api/me:
            get:
              security:
                - CognitoUserPool: []
              responses:
                '200':
                  description: The signed-in family member
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MeGetFunction.Arn}/invocations'
          /api/auth/session:
            post:
              x-amazon-apigateway-request-validator: body-only
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SessionMintRequest'
              responses:
                '200':
                  description: Session started
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSessionFunction.Arn}/invocations'
            delete:
              responses:
                '204':
                  description: Session ended
