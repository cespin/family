AWSTemplateFormatVersion: '2010-09-09'
Description: 'Build artifacts bucket, created before everything else'
Parameters:
  ExportKey:
    Type: String
  StackName:
    Type: String
  Salt:
    Type: String
Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketNamePrefix: !Sub '${StackName}-${Salt}-artifacts'
      BucketNamespace: account-regional
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Sceptre uploads a copy of the template on every deploy. Lambda packages under
          # lambda/ are kept, because a stack rollback needs the previous package.
          - Id: ExpireUploadedTemplates
            Status: Enabled
            Prefix: 'templates/'
            ExpirationInDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${ExportKey}-${StackName}-ArtifactsBucketName'
